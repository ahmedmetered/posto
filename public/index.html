<title>Posto</title>
<link rel="icon" type="image/svg+xml" href="/mark.svg">
<style>
  @font-face { font-family:"Bricolage Grotesque"; src:url(/fonts/bricolage.woff2) format("woff2"); font-weight:400 800; font-display:swap; }

  /* Posto: a customs hall. Cobalt desk, guilloche visa pages, inked stamps. One theme by design. */
  :root { --desk:#2B35FF; --desk-deep:#1B22C9; --page:#F4F2FF; --page-2:#E7E4FF; --ink:#14143A; --ink-2:#4A4A7A; --ink-3:#5E5E8E; --line:#C9C5F2;

  * { box-sizing:border-box; margin:0; padding:0; }
  html { scrollbar-color:var(--yellow) var(--desk-deep); scrollbar-width:thin; }

  h2 { font-size:19px; font-weight:700; margin-bottom:8px; }
  h3 { font-size:13px; margin:22px 0 10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--on-desk); }
  .card h3 { color:var(--ink-2); margin:16px 0 6px; }

  /* masthead: the wordmark is a rubber stamp, the sections are page-edge tabs */

    transition:transform .18s var(--out), background-color .18s, color .18s; }

  button:active, .btn:active { transform:scale(.94) rotate(1deg); }
  button:disabled { opacity:.5; cursor:default; transform:none; }

  button.primary:hover { background:var(--violet); border-color:var(--violet); }

  header button.link { color:var(--on-desk-2); border:0; } header button.link:hover { color:var(--yellow); background:none; }
  nav button { border-radius:8px 8px 0 0; border-width:2px 2px 0; padding:10px 14px 8px; background:rgba(255,255,255,.1); }
  button.on, header button.on, .segs button.on { background:var(--page); color:var(--ink); border-color:var(--page); transform:translateY(-3px) rotate(-1deg); font-weight:800; }

  /* a job is a visa page; its verdict is the stamp */

  .visa { margin:0; padding-top:16px; }

  .visa h2 { font-size:25px; line-height:1.12; margin:10px 0 6px; padding-right:130px; font-weight:800; }
  .where { font:400 14px/1.35 var(--typed); color:var(--ink-2); margin-bottom:12px; }
  .conds { border-top:2px dotted var(--line); padding-top:10px; margin-top:4px; }
  .cvline { font:400 13.5px var(--typed); margin:8px 0 0; color:var(--ink-2); } .cvline b { color:var(--ink); }
  .mrz { margin:14px -18px 12px; padding:7px 18px; background:var(--page-2); font:700 12px/1.35 var(--typed); letter-spacing:.14em; color:rgba(20,20,58,.55); white-space:nowrap; overflow:hidden; text-overflow:clip; user-select:none; }
  .stamp { position:absolute; top:34px; right:16px; transform:rotate(var(--rot,-9deg)); font:800 21px/1 var(--type); letter-spacing:.09em; text-transform:uppercase; color:var(--good); border:4px double currentColor; border-radius:5px; padding:9px 13px 8px;
    filter:url(#ink); text-align:center; animation:slam .55s var(--out) both; animation-delay:calc(var(--i,0) * 90ms + 120ms); }

  @media (max-width:1300px) { .builder { grid-template-columns:1fr; } } .ent { border:2px dotted var(--line); border-radius:4px; padding:10px; margin:8px 0; } .sec { margin-top:14px; }

  .stat .n { font:800 44px/1 var(--type); letter-spacing:-.03em; font-variant-numeric:tabular-nums; } .stat .l { font:600 13.5px var(--type); margin-top:6px; }
  .stat.s0 { background:var(--yellow); } .stat.s1 { background:#7CF0B2; } .stat.s2 { background:#FF9A5C; } .stat.s3 { background:#C7B8FF; } .stat.s4 { background:var(--page); }

  .fx, .filters input, .filters select { width:auto; font:600 13px var(--type); color:var(--on-desk); background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.4); border-radius:4px; padding:8px 10px; }
  .fx option { color:var(--ink); background:#fff; } .fx::placeholder { color:var(--on-desk-2); }
  .fx:focus { border-color:var(--yellow); box-shadow:none; }
  .fxbtn { color:var(--on-desk); border-color:rgba(255,255,255,.4); padding:8px 12px; } .fxbtn:hover { background:var(--on-desk); color:var(--desk); }
  .fxbtn.on { background:var(--yellow); color:var(--ink); border-color:var(--yellow); }
  .bulk { position:sticky; top:8px; z-index:5; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--yellow); color:var(--ink); border:3px double var(--ink); border-radius:4px; padding:8px 12px; margin:8px 0 12px; }
  .bulk .fxbtn { color:var(--ink); border-color:var(--ink); } .bulk .fxbtn:hover { background:var(--ink); color:var(--yellow); } .bulk .fx { color:var(--ink); background:#fff; border-color:var(--ink); }
  .slip .pick { position:absolute; top:10px; right:10px; margin:0; } .slip .pick input { margin:0; width:18px; height:18px; }
  .modal-back { position:fixed; inset:0; background:rgba(8,10,80,.6); display:grid; place-items:center; z-index:20; padding:16px; animation:land .2s var(--out) both; }

<script>
