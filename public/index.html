<style>

  /* Posto: a customs hall. Cobalt desk, guilloche visa pages, inked stamps. One theme by design. */

  const off = new Set(s.feedsOff), feedBoxes = s.feeds.map(f => [f, h("input", { type: "checkbox", checked: !off.has(f) })]);
  const B = { ats: h("select", {}, s.atsList.map(a => h("option", { value: a }, a))), slug: h("input", { placeholder: "e.g. stripe" }) };
  const srcCard = h("div", { class: "card" }, h("h2", {}, "Where jobs come from"),
    h("p", { class: "muted", style: "margin-bottom:8px" }, "Public job feeds and company career pages only. I never log in to or scrape LinkedIn or Indeed."),
    h("div", { class: "row" }, feedBoxes.map(([f, box]) => h("label", { class: "check", style: "margin-right:14px" }, box, f))),
    h("div", { style: "margin-top:8px" }, h("button", { onclick: guard(async () => { await api("/settings", "PUT", { feedsOff: feedBoxes.filter(([, b]) => !b.checked).map(([f]) => f) }); toast("Saved."); }) }, "Save feeds")),
    h("h3", {}, `Company career pages I watch (${s.boards.length})`),
    h("div", { class: "row" }, s.boards.map(b => h("span", { class: "chip" }, `${b.slug} · ${b.ats}`, h("button", { "aria-label": "Stop watching " + b.slug, onclick: guard(async () => { await api(`/boards/${b.id}`, "DELETE"); render(); }) }, "×")))),
    h("h3", {}, "Watch another company"), h("p", { class: "tiny" }, "Open the company's careers page. If the address looks like boards.greenhouse.io/stripe or jobs.lever.co/stripe, the system is greenhouse or lever and the name is stripe."),
    h("div", { class: "row", style: "margin-top:6px" }, B.ats, h("div", { style: "flex:1;min-width:160px" }, B.slug), h("button", { onclick: guard(async () => { say("Checking..."); const r = await api("/boards", "POST", { ats: B.ats.value, slug: B.slug.value }); toast(`Added. ${r.postings} open postings.`); render(); }) }, "Add")));

  // --- browser extension (for LinkedIn, Indeed and any other page you are looking at)
  const tokenOut = h("div", {});
  const extCard = h("div", { class: "card" }, h("h2", {}, "Browser extension (optional)"),
    h("p", { class: "muted", style: "margin-bottom:8px" }, "For jobs on LinkedIn, Indeed or any other site: open a posting, click the extension, and it tells you whether the job fits you and saves it to your tracker. It only reads the page you click it on; nothing is collected in the background and the app never logs in to those sites."),

    h("div", { class: "row" }, h("button", { class: "primary", onclick: guard(async () => { const r = await api("/token", "POST"); tokenOut.replaceChildren(h("label", {}, "Copy this now. It is shown only once."), h("input", { readonly: true, value: r.token, onfocus: e => e.target.select() }), h("p", { class: "tiny" }, "App address for the extension: " + location.origin)); }) }, s.hasToken ? "Create a new token" : "Create a token"),
      s.hasToken ? h("button", { class: "link danger", onclick: guard(async () => { await api("/token", "DELETE"); toast("Token revoked."); render(); }) }, "Revoke") : null), tokenOut);

  $app.replaceChildren(shell("settings", cvCard, mailCard, schedCard, aiCard, srcCard, extCard, msg));

// ---------- shell, router ----------
function shell(active, ...body) {
  const tab = (k, label) => h("button", { class: active === k ? "on" : "", onclick: () => { location.hash = "#/" + k; } }, label);
  return h("div", {}, h("header", {}, h("span", { class: "brand" }, BRAND), h("nav", {}, tab("today", "Today"), tab("tracker", "Tracker"), tab("insights", "Insights"), tab("profile", "My situation"), tab("settings", "Settings")), h("span", { class: "sp" }),
    h("span", { class: "tiny" }, state.me.user.email), h("button", { onclick: async () => { await api("/logout", "POST"); state.me = null; render(); } }, "Sign out"),
    h("button", { class: "link", onclick: () => { location.href = "/api/export"; } }, "Download my data")), ...body);
}
async function render() {
  try {
    if (!state.me) { renderAuth(); return; }
    const route = (location.hash.replace("#/", "") || "today");
    if (!state.me.profile) { renderProfile(true); return; }
    if (route === "profile") renderProfile(false); else if (route === "tracker") await renderTracker(); else if (route === "insights") await renderInsights(); else if (route === "settings") await renderSettings(); else await renderToday();
  } catch (e) { if (e.status === 401) { state.me = null; renderAuth(); } else $app.replaceChildren(h("div", { class: "card err" }, e.message)); }
}
async function boot() {
  try { state.meta = await api("/meta"); state.me = await api("/me"); } catch { state.me = null; }
  render();
}
addEventListener("hashchange", render);
boot();
